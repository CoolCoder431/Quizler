<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - Quizler</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="profile.css">
</head>

<body>

<!-- Top Navigation Bar -->
<nav class="top-navbar">

  <div class="navbar-brand">
    <span class="logo">🎯 Quizler</span>
  </div>

  <div class="navbar-menu">

    <a href="/home" class="nav-link">
      🏠 Home
    </a>

    <a href="/quiz" class="nav-link">
      📝 Quiz
    </a>

    <a href="/profile" class="nav-link active">
      👤 Profile
    </a>

    <button
      onclick="logout()"
      class="nav-link logout"
      style="background: none; border: none; cursor: pointer; font-size: inherit; color: inherit; text-decoration: none;"
    >
      🚪 Logout
    </button>

  </div>

</nav>


<!-- Main Content -->
<div class="profile-container">

  <!-- Profile Header -->
  <div class="profile-header">

    <div class="profile-avatar">
      <span class="avatar-icon">👤</span>
    </div>

    <h1 id="userName">Loading...</h1>

    <p class="profile-subtitle">
      Quiz Enthusiast
    </p>

  </div>


  <!-- Profile Statistics -->
  <div class="profile-stats">

    <!-- Quizzes Taken -->
    <div class="stat-card">

      <div class="stat-icon">
        🎯
      </div>

      <div
        class="stat-number"
        id="quizzesTaken"
      >
        0
      </div>

      <div class="stat-label">
        Quizzes Taken
      </div>

    </div>


    <!-- Average Score -->
    <div class="stat-card">

      <div class="stat-icon">
        🏆
      </div>

      <div
        class="stat-number"
        id="averageScore"
      >
        0%
      </div>

      <div class="stat-label">
        Average Score
      </div>

    </div>


    <!-- Streak -->
    <div class="stat-card">

      <div class="stat-icon">
        ⚡
      </div>

      <div
        class="stat-number"
        id="streakDays"
      >
        0
      </div>

      <div class="stat-label">
        Streak Days
      </div>

    </div>

  </div>


  <!-- Quiz History -->
  <div class="quiz-history-section">

    <h3>
      Quiz History
    </h3>

    <!-- JavaScript will insert quiz results here -->
    <div
      class="history-list"
      id="historyList"
    >
    </div>

  </div>


  <!-- Profile Actions -->
  <div class="profile-actions">

    <button
      class="profile-btn primary"
      onclick="window.location.href='/quiz'"
    >
      Take New Quiz
    </button>

    <button
      class="profile-btn secondary"
    >
      Edit Profile
    </button>

  </div>

</div>


<!-- JavaScript -->
<script src="profile.js"></script>
<script src="logout.js"></script>

</body>
</html>
